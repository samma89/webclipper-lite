<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clipfolio Library</title>
  <link rel="icon" type="image/png" href="../icons/icon32.png">
  <link rel="stylesheet" href="library.css">
</head>
<body>
  <aside>
    <div class="brand"><img src="../icons/icon48.png" width="28" height="28" alt=""><span>Clipfolio</span></div>
    <div class="side-head">
      <input id="search" type="search" placeholder="Search clips…" autocomplete="off">
      <button id="export-all" title="Export every clip as one JSON file">Export all</button>
    </div>
    <ul id="list"></ul>
    <p id="empty" hidden>No clips yet. Use the toolbar button or right-click a page to clip.</p>
  </aside>
  <section>
    <div id="toolbar" hidden>
      <div class="meta">
        <div id="clip-title" class="clip-title"></div>
        <a id="clip-source" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="actions">
        <button id="export-md">Markdown</button>
        <button id="export-html">HTML</button>
        <button id="delete" class="danger">Delete</button>
      </div>
    </div>
    <iframe id="viewer" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Clip preview"></iframe>
  </section>
  <script type="module" src="library.js"></script>
</body>
</html>
